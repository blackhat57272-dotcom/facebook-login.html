<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Aurora AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0A0F;--surface:#17161D;--surface-2:#1E1C26;
  --border:rgba(255,255,255,0.06);--border-2:rgba(255,255,255,0.10);
  --text:#F5F3F7;--text-2:#A5A0B0;--text-3:#6B6678;--text-4:#3D3948;
  --purple:#A78BFA;--purple-2:#8B5CF6;--pink:#F0ABFC;--blue:#60A5FA;
  --grad:linear-gradient(135deg,#A78BFA 0%,#8B5CF6 50%,#F0ABFC 100%);
  --grad-soft:linear-gradient(135deg,rgba(167,139,250,0.12),rgba(240,171,252,0.08));
  --grad-user:linear-gradient(135deg,#8B5CF6 0%,#A78BFA 35%,#F0ABFC 70%,#60A5FA 100%);
  --grad-user-soft:linear-gradient(135deg,rgba(139,92,246,0.22) 0%,rgba(167,139,250,0.18) 35%,rgba(240,171,252,0.14) 70%,rgba(96,165,250,0.12) 100%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
  display:flex;justify-content:center;align-items:center;
  -webkit-font-smoothing:antialiased;font-feature-settings:'cv11','ss01';position:relative;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 60% 50% at 15% 0%,rgba(167,139,250,0.10),transparent 55%),
    radial-gradient(ellipse 60% 50% at 85% 100%,rgba(240,171,252,0.08),transparent 55%),
    radial-gradient(ellipse 80% 60% at 50% 50%,rgba(96,165,250,0.04),transparent 70%);
  pointer-events:none;z-index:0;animation:ambientShift 20s ease-in-out infinite alternate;
}
@keyframes ambientShift{0%{background-position:0% 0%}100%{background-position:100% 100%}}
.orb-bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:0.35}
.orb-1{width:400px;height:400px;background:radial-gradient(circle,#8B5CF6,transparent 70%);top:-15%;left:-10%;animation:orbFloat1 25s ease-in-out infinite alternate}
.orb-2{width:450px;height:450px;background:radial-gradient(circle,#F0ABFC,transparent 70%);bottom:-20%;right:-15%;animation:orbFloat2 30s ease-in-out infinite alternate}
.orb-3{width:350px;height:350px;background:radial-gradient(circle,#60A5FA,transparent 70%);top:40%;left:50%;animation:orbFloat3 28s ease-in-out infinite alternate}
@keyframes orbFloat1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(200px,150px) scale(1.3)}}
@keyframes orbFloat2{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-180px,-120px) scale(1.2)}}
@keyframes orbFloat3{0%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-30%,-70%) scale(0.8)}}
.sparkle-container{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.sparkle{position:absolute;width:2px;height:2px;border-radius:50%;background:rgba(167,139,250,0.9);box-shadow:0 0 6px rgba(167,139,250,0.8);animation:sparkleRise linear infinite;opacity:0}
@keyframes sparkleRise{
  0%{opacity:0;transform:translateY(100vh) scale(0)}
  15%{opacity:1;transform:translateY(85vh) scale(1)}
  85%{opacity:1}100%{opacity:0;transform:translateY(-20vh) scale(0.5)}
}
body::after{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
  opacity:0.025;pointer-events:none;z-index:999;mix-blend-mode:overlay;
}
.app{
  position:relative;z-index:2;width:100%;max-width:1240px;
  height:100vh;max-height:940px;display:flex;
  background:rgba(23,22,29,0.7);
  backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
  border:1px solid var(--border);overflow:hidden;
  box-shadow:0 30px 90px -20px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.02) inset;
  animation:appEnter 0.9s cubic-bezier(0.16,1,0.3,1);
}
@keyframes appEnter{from{opacity:0;transform:scale(0.97) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
@media(min-width:768px){.app{height:calc(100vh - 40px);margin:20px;border-radius:20px}}

.sidebar{
  width:280px;background:rgba(11,10,15,0.6);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:20px 14px;
  transition:transform 0.55s cubic-bezier(0.16,1,0.3,1);
  z-index:100;backdrop-filter:blur(20px);
}
@media(max-width:768px){
  .sidebar{position:absolute;left:0;top:0;bottom:0;transform:translateX(-100%);
    background:rgba(11,10,15,0.98);box-shadow:30px 0 60px rgba(0,0,0,0.7);}
  .sidebar.open{transform:translateX(0)}
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px;border-bottom:1px solid var(--border);margin-bottom:14px}
.logo{
  width:36px;height:36px;border-radius:10px;
  background:var(--grad);background-size:200% 200%;
  display:grid;place-items:center;font-size:18px;font-weight:800;color:white;
  box-shadow:0 8px 20px -4px rgba(167,139,250,0.5),0 0 0 1px rgba(255,255,255,0.1) inset;
  animation:logoFloat 3.5s ease-in-out infinite,logoGrad 6s ease-in-out infinite;position:relative;
}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes logoGrad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.logo::before{content:'◆';font-size:14px}
.logo::after{content:'';position:absolute;inset:-4px;border-radius:14px;background:var(--grad);opacity:0;filter:blur(8px);z-index:-1;animation:logoGlow 3s ease-in-out infinite}
@keyframes logoGlow{0%,100%{opacity:0.2}50%{opacity:0.5}}
.brand-name{font-size:0.98rem;font-weight:700;letter-spacing:-0.02em;color:var(--text)}
.brand-sub{font-size:0.65rem;color:var(--text-3);letter-spacing:0.10em;text-transform:uppercase;font-weight:600;margin-top:2px}

.new-chat{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:11px 13px;margin-bottom:16px;border-radius:11px;
  background:linear-gradient(135deg,rgba(167,139,250,0.12),rgba(240,171,252,0.08));
  border:1px solid rgba(167,139,250,0.25);color:var(--text);
  font-family:inherit;font-size:0.88rem;font-weight:600;letter-spacing:-0.005em;
  cursor:pointer;text-align:left;
  transition:all 0.3s cubic-bezier(0.16,1,0.3,1);
  position:relative;overflow:hidden;box-shadow:0 4px 16px -4px rgba(167,139,250,0.15);
}
.new-chat::before{content:'';position:absolute;inset:0;background:var(--grad);opacity:0;transition:opacity 0.3s;pointer-events:none}
.new-chat:hover::before{opacity:0.15}
.new-chat:hover{transform:translateY(-2px);border-color:rgba(167,139,250,0.5);box-shadow:0 8px 24px -4px rgba(167,139,250,0.4),0 0 0 1px rgba(167,139,250,0.2) inset}
.new-chat:active{transform:translateY(0) scale(0.98)}
.new-chat-ic{
  width:22px;height:22px;border-radius:7px;
  background:var(--grad);background-size:200% 200%;
  display:grid;place-items:center;color:white;font-size:12px;font-weight:800;
  flex-shrink:0;position:relative;z-index:1;
  animation:logoGrad 5s ease-in-out infinite;
  box-shadow:0 2px 8px -2px rgba(167,139,250,0.5);
}
.new-chat-ic::before{content:'+';font-size:14px;line-height:1}
.new-chat-label{position:relative;z-index:1;display:flex;flex-direction:column;gap:1px}
.new-chat-label .main{font-size:0.86rem;font-weight:600;color:var(--text);line-height:1.1}
.new-chat-label .sub{font-size:0.62rem;font-weight:500;color:var(--text-3);letter-spacing:0.02em;line-height:1.1}
.new-chat-shortcut{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:0.62rem;padding:2px 6px;border-radius:5px;background:rgba(0,0,0,0.3);border:1px solid var(--border);color:var(--text-3);position:relative;z-index:1;font-weight:600}

.history-block{flex:1;overflow-y:auto;margin-bottom:14px;padding-right:4px;min-height:0}
.history-block::-webkit-scrollbar{width:4px}
.history-block::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:100px}
.history-label{
  font-size:0.65rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--text-4);padding:0 10px 8px;display:flex;align-items:center;justify-content:space-between;
}
.history-label .count{font-size:0.62rem;padding:2px 7px;border-radius:100px;background:rgba(167,139,250,0.1);color:var(--purple);font-family:'JetBrains Mono',monospace}
.history-empty{padding:16px 12px;text-align:center;font-size:0.75rem;color:var(--text-4);font-style:italic}

.history-item{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:9px 10px;border-radius:9px;background:transparent;border:none;
  color:var(--text-2);font-family:inherit;font-size:0.82rem;font-weight:500;
  letter-spacing:-0.005em;cursor:pointer;text-align:left;margin-bottom:2px;
  transition:all 0.2s cubic-bezier(0.16,1,0.3,1);
  position:relative;overflow:hidden;
}
.history-item:hover{background:rgba(255,255,255,0.04);color:var(--text)}
.history-item.active{background:var(--grad-soft);color:var(--text);box-shadow:0 0 0 1px rgba(167,139,250,0.25) inset}
.history-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad);border-radius:0 3px 3px 0}
.history-icon{width:16px;height:16px;flex-shrink:0;display:grid;place-items:center;font-size:11px;opacity:0.6}
.history-item.active .history-icon{opacity:1;color:var(--purple)}
.history-info{flex:1;min-width:0}
.history-title{font-size:0.82rem;font-weight:500;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:1.3}
.history-time{font-size:0.62rem;color:var(--text-4);font-weight:500;letter-spacing:0.02em;margin-top:1px;display:block}
.history-item.active .history-time{color:var(--text-3)}
.history-del{width:22px;height:22px;flex-shrink:0;border-radius:6px;background:transparent;border:none;color:var(--text-4);font-size:11px;cursor:pointer;display:grid;place-items:center;opacity:0;transition:all 0.2s}
.history-item:hover .history-del{opacity:1}
.history-del:hover{background:rgba(244,63,94,0.15);color:#F43F5E}

.nav-block{margin-bottom:16px;padding-top:8px;border-top:1px solid var(--border)}
.nav-label{font-size:0.65rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-4);padding:0 10px 8px}
.persona{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:9px;background:transparent;border:none;color:var(--text-2);font-family:inherit;font-size:0.85rem;font-weight:500;letter-spacing:-0.005em;cursor:pointer;text-align:left;margin-bottom:2px;transition:all 0.25s cubic-bezier(0.16,1,0.3,1);position:relative;overflow:hidden}
.persona::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad);border-radius:0 3px 3px 0;transform:scaleY(0);transition:transform 0.3s cubic-bezier(0.16,1,0.3,1)}
.persona:hover{background:rgba(255,255,255,0.03);color:var(--text);transform:translateX(2px)}
.persona.active{background:var(--grad-soft);color:var(--text);box-shadow:0 0 0 1px rgba(167,139,250,0.2) inset}
.persona.active::before{transform:scaleY(1)}
.persona-icon{font-size:13px;width:14px;text-align:center;opacity:0.7;transition:all 0.3s}
.persona:hover .persona-icon,.persona.active .persona-icon{opacity:1;transform:scale(1.1)}

.engine-wrap{position:relative;margin:0 2px}
.engine-btn{width:100%;padding:11px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;color:var(--text);font-family:inherit;font-size:0.82rem;font-weight:600;letter-spacing:-0.005em;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;transition:all 0.25s cubic-bezier(0.16,1,0.3,1);position:relative;overflow:hidden}
.engine-btn:hover{background:rgba(255,255,255,0.04);border-color:var(--border-2)}
.engine-btn.open{border-color:var(--purple);background:rgba(167,139,250,0.06);box-shadow:0 0 0 3px rgba(167,139,250,0.10)}
.engine-btn::after{content:'';position:absolute;right:16px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--text-3);border-bottom:1.5px solid var(--text-3);transform:translateY(-70%) rotate(45deg);transition:all 0.3s cubic-bezier(0.16,1,0.3,1);pointer-events:none}
.engine-btn.open::after{transform:translateY(-30%) rotate(225deg);border-color:var(--purple)}
.engine-btn-label{flex:1;display:flex;align-items:center;gap:9px;min-width:0}
.engine-btn-dot{width:7px;height:7px;border-radius:50%;background:var(--purple);box-shadow:0 0 8px rgba(167,139,250,0.7);flex-shrink:0;animation:dotPulse 2.4s ease-in-out infinite}
@keyframes dotPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:0.7}}
.engine-btn-text{font-size:0.82rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.engine-menu{position:absolute;bottom:calc(100% + 8px);left:0;right:0;background:rgba(20,19,28,0.96);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--border-2);border-radius:14px;padding:6px;box-shadow:0 20px 50px -10px rgba(0,0,0,0.8),0 0 0 1px rgba(255,255,255,0.03) inset;opacity:0;transform:translateY(8px) scale(0.96);pointer-events:none;transition:all 0.28s cubic-bezier(0.16,1,0.3,1);z-index:200;overflow:hidden;transform-origin:bottom center}
.engine-menu::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--grad);opacity:0.4}
.engine-menu.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.engine-option{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border-radius:9px;background:transparent;border:none;color:var(--text-2);font-family:inherit;font-size:0.82rem;font-weight:500;letter-spacing:-0.005em;cursor:pointer;text-align:left;transition:all 0.2s cubic-bezier(0.16,1,0.3,1);position:relative;overflow:hidden}
.engine-option:hover{background:rgba(255,255,255,0.05);color:var(--text);transform:translateX(2px)}
.engine-option.active{background:var(--grad-soft);color:var(--text);box-shadow:0 0 0 1px rgba(167,139,250,0.25) inset}
.engine-option-mark{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--border-2);display:grid;place-items:center;flex-shrink:0;transition:all 0.25s cubic-bezier(0.16,1,0.3,1);background:rgba(0,0,0,0.2)}
.engine-option.active .engine-option-mark{background:var(--grad);background-size:200% 200%;border-color:transparent;box-shadow:0 0 10px rgba(167,139,250,0.5);animation:logoGrad 4s ease-in-out infinite}
.engine-option-mark::before{content:'';width:6px;height:6px;border-radius:50%;background:white;transform:scale(0);transition:transform 0.25s cubic-bezier(0.16,1,0.3,1);box-shadow:0 0 6px rgba(255,255,255,0.8)}
.engine-option.active .engine-option-mark::before{transform:scale(1)}
.engine-option-info{flex:1;min-width:0}
.engine-option-name{display:block;font-size:0.83rem;font-weight:600;color:inherit;line-height:1.2}
.engine-option-desc{display:block;font-size:0.66rem;font-weight:500;color:var(--text-4);letter-spacing:0.02em;margin-top:2px;line-height:1.2}
.engine-option.active .engine-option-desc{color:var(--text-3)}

.bottom{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:2px}
.ghost{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:9px;background:transparent;border:none;color:var(--text-3);font-family:inherit;font-size:0.83rem;font-weight:500;letter-spacing:-0.005em;cursor:pointer;text-align:left;transition:all 0.25s cubic-bezier(0.16,1,0.3,1);position:relative;overflow:hidden}
.ghost::after{content:'';position:absolute;inset:0;background:var(--grad);opacity:0;transition:opacity 0.3s;pointer-events:none;border-radius:inherit}
.ghost:hover::after{opacity:0.04}
.ghost-ic{font-size:12px;width:14px;text-align:center;opacity:0.8;transition:transform 0.3s;position:relative;z-index:1}
.ghost:hover .ghost-ic{transform:scale(1.2)}
.ghost:hover{color:var(--text);transform:translateX(2px)}

.main{flex:1;display:flex;flex-direction:column;min-width:0;background:rgba(11,10,15,0.3)}
.topbar{padding:14px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:rgba(11,10,15,0.4);backdrop-filter:blur(20px);z-index:10;min-height:60px}
.menu{display:none;width:36px;height:36px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;color:var(--text-2);font-size:0.95rem;cursor:pointer;transition:all 0.25s}
.menu:hover{background:var(--surface);color:var(--text);transform:scale(1.05)}
.menu:active{transform:scale(0.95)}
@media(max-width:768px){.menu{display:grid;place-items:center}}
.title{display:flex;align-items:center;gap:10px;font-size:0.88rem;font-weight:600;color:var(--text);letter-spacing:-0.01em}
.status-dot{width:7px;height:7px;border-radius:50%;background:#4ADE80;box-shadow:0 0 8px rgba(74,222,128,0.7);animation:statusPulse 2.5s ease-in-out infinite;position:relative}
.status-dot::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:1px solid rgba(74,222,128,0.5);animation:statusRing 2.5s ease-out infinite}
@keyframes statusPulse{0%,100%{opacity:1;box-shadow:0 0 8px rgba(74,222,128,0.7)}50%{opacity:0.6;box-shadow:0 0 14px rgba(74,222,128,1)}}
@keyframes statusRing{0%{transform:scale(0.8);opacity:1}100%{transform:scale(2.2);opacity:0}}
.badge{font-size:0.65rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--purple);padding:5px 12px;border-radius:100px;background:rgba(167,139,250,0.08);border:1px solid rgba(167,139,250,0.22);animation:badgeGlow 3s ease-in-out infinite}
@keyframes badgeGlow{0%,100%{box-shadow:0 0 0 0 rgba(167,139,250,0)}50%{box-shadow:0 0 20px 0 rgba(167,139,250,0.3)}}

.stream{flex:1;overflow-y:auto;padding:32px 24px;display:flex;flex-direction:column;gap:24px;scroll-behavior:smooth;position:relative}
.stream::-webkit-scrollbar{width:6px}
.stream::-webkit-scrollbar-track{background:transparent}
.stream::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:100px}
.stream::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.15)}

.welcome{text-align:center;margin:auto;padding:40px 24px;max-width:520px}
.welcome > *{animation:fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) both}
.welcome > *:nth-child(1){animation-delay:0.1s}
.welcome > *:nth-child(2){animation-delay:0.2s}
.welcome > *:nth-child(3){animation-delay:0.3s}
.welcome > *:nth-child(4){animation-delay:0.4s}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.wm-logo{width:72px;height:72px;border-radius:20px;margin:0 auto 24px;background:var(--grad);background-size:200% 200%;display:grid;place-items:center;font-size:32px;color:white;position:relative;box-shadow:0 20px 50px -10px rgba(167,139,250,0.5),0 0 0 1px rgba(255,255,255,0.1) inset,0 2px 0 rgba(255,255,255,0.2) inset;animation:wmFloat 4s ease-in-out infinite,logoGrad 6s ease-in-out infinite}
@keyframes wmFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.wm-logo::before{content:'◆'}
.wm-logo::after{content:'';position:absolute;inset:-25px;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,0.25),transparent 65%);z-index:-1;animation:glowPulse 3.5s ease-in-out infinite}
@keyframes glowPulse{0%,100%{opacity:0.6;transform:scale(0.95)}50%{opacity:1;transform:scale(1.1)}}
.welcome h1{font-size:1.9rem;font-weight:700;letter-spacing:-0.04em;line-height:1.15;margin-bottom:12px;color:var(--text)}
.welcome h1 .accent{background:var(--grad);background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:logoGrad 4s ease-in-out infinite}
.welcome p{font-size:0.94rem;color:var(--text-2);line-height:1.65;margin-bottom:28px;font-weight:400;letter-spacing:-0.005em}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:420px;margin:0 auto}
.qc{padding:13px 15px;border-radius:11px;background:rgba(255,255,255,0.025);border:1px solid var(--border);cursor:pointer;text-align:left;color:var(--text-2);font-family:inherit;font-size:0.83rem;font-weight:500;letter-spacing:-0.005em;transition:all 0.3s cubic-bezier(0.16,1,0.3,1);display:flex;align-items:center;gap:9px;position:relative;overflow:hidden}
.qc::before{content:'';position:absolute;inset:0;background:var(--grad);opacity:0;transition:opacity 0.3s;pointer-events:none}
.qc:hover::before{opacity:0.06}
.qc:hover{background:rgba(255,255,255,0.05);border-color:var(--border-2);color:var(--text);transform:translateY(-2px);box-shadow:0 8px 20px -6px rgba(167,139,250,0.2)}
.qc:active{transform:translateY(0) scale(0.98)}
.qc .ic{font-size:13px;opacity:0.7;transition:all 0.3s;position:relative;z-index:1}
.qc:hover .ic{opacity:1;transform:scale(1.15) rotate(-5deg)}
.qc > *{position:relative;z-index:1}

.msg{display:flex;gap:14px;align-items:flex-start;animation:msgIn 0.6s cubic-bezier(0.16,1,0.3,1) both;max-width:820px;width:100%}
@keyframes msgIn{from{opacity:0;transform:translateY(12px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.msg.user{margin-left:auto;flex-direction:row-reverse;animation:msgInUser 0.65s cubic-bezier(0.16,1,0.3,1) both}
@keyframes msgInUser{
  0%{opacity:0;transform:translateX(20px) scale(0.96)}
  60%{opacity:1;transform:translateX(-2px) scale(1.01)}
  100%{opacity:1;transform:translateX(0) scale(1)}
}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0;color:white;position:relative;margin-top:2px;transition:transform 0.3s}
.msg:hover .av{transform:scale(1.08)}
.av.bot{background:var(--grad);background-size:200% 200%;box-shadow:0 4px 12px -2px rgba(167,139,250,0.4),0 0 0 1px rgba(255,255,255,0.1) inset;animation:logoGrad 6s ease-in-out infinite}
.av.bot::before{content:'◆';font-size:12px}
.av.user{
  background:var(--grad-user);background-size:250% 250%;
  border:none;color:white;font-size:10px;letter-spacing:0.06em;font-weight:800;
  text-shadow:0 1px 2px rgba(0,0,0,0.3);
  box-shadow:0 6px 18px -4px rgba(167,139,250,0.6),0 0 0 1px rgba(255,255,255,0.15) inset,0 1px 0 rgba(255,255,255,0.3) inset;
  animation:logoGrad 5s ease-in-out infinite, userAvatarGlow 3s ease-in-out infinite;
  position:relative;overflow:hidden;
}
.av.user::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,0.4),transparent 45%);pointer-events:none}
.av.user::after{content:'';position:absolute;inset:-6px;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,0.4),transparent 70%);z-index:-1;opacity:0;animation:userAvatarHalo 3s ease-in-out infinite}
@keyframes userAvatarGlow{
  0%,100%{box-shadow:0 6px 18px -4px rgba(167,139,250,0.6),0 0 0 1px rgba(255,255,255,0.15) inset,0 1px 0 rgba(255,255,255,0.3) inset}
  50%{box-shadow:0 8px 24px -4px rgba(240,171,252,0.7),0 0 0 1px rgba(255,255,255,0.2) inset,0 1px 0 rgba(255,255,255,0.4) inset}
}
@keyframes userAvatarHalo{0%,100%{opacity:0.3;transform:scale(1)}50%{opacity:0.7;transform:scale(1.15)}}

.body{flex:1;min-width:0}
.mname{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;padding:0 2px}
.msg.user .mname{justify-content:flex-end}
.mname .name{font-size:0.82rem;font-weight:600;color:var(--text);letter-spacing:-0.01em}
.msg.user .mname .name{background:var(--grad-user);background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:logoGrad 6s ease-in-out infinite;font-weight:700}
.mname .time{font-size:0.7rem;color:var(--text-4);font-weight:500;letter-spacing:0.02em}

.bubble{font-size:0.94rem;line-height:1.7;letter-spacing:-0.008em;word-wrap:break-word;font-weight:400;color:var(--text)}
.bubble.bot{color:var(--text);padding:2px 2px 0}
.bubble.user{
  background:var(--grad-user-soft);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(167,139,250,0.35);
  padding:14px 18px;border-radius:18px;border-top-right-radius:5px;
  color:var(--text);position:relative;overflow:hidden;
  box-shadow:0 8px 24px -8px rgba(139,92,246,0.4),0 0 0 1px rgba(255,255,255,0.04) inset,0 1px 0 rgba(255,255,255,0.06) inset;
  animation:userBubbleIn 0.55s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes userBubbleIn{0%{opacity:0;transform:translateY(6px) scale(0.97)}100%{opacity:1;transform:translateY(0) scale(1)}}
.bubble.user::after{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(135deg,rgba(167,139,250,0.6),rgba(240,171,252,0.5),rgba(96,165,250,0.4),rgba(167,139,250,0.6));
  background-size:300% 300%;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  pointer-events:none;animation:borderFlow 6s ease-in-out infinite;opacity:0.7;
}
@keyframes borderFlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.bubble.user::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,0.08) 45%,rgba(240,171,252,0.12) 50%,rgba(255,255,255,0.08) 55%,transparent 70%);
  animation:shimmerSweep 5s ease-in-out infinite;pointer-events:none;
}
@keyframes shimmerSweep{0%{left:-100%}50%,100%{left:100%}}

.bubble.bot strong{font-weight:600;color:var(--text)}
.bubble.bot a{color:var(--purple);text-decoration:none;border-bottom:1px solid rgba(167,139,250,0.4);transition:all 0.2s}
.bubble.bot a:hover{border-bottom-color:var(--purple);background:rgba(167,139,250,0.08)}
.bubble.bot code{font-family:'JetBrains Mono',monospace;background:rgba(167,139,250,0.10);color:var(--purple);padding:2px 6px;border-radius:5px;font-size:0.85em;font-weight:500}
.bubble.bot pre{background:var(--bg);border:1px solid var(--border);padding:16px 18px;border-radius:10px;overflow-x:auto;margin:12px 0;font-family:'JetBrains Mono',monospace;font-size:0.82rem;line-height:1.65;animation:codeReveal 0.5s cubic-bezier(0.16,1,0.3,1)}
@keyframes codeReveal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.bubble.bot pre code{background:none;color:var(--text);padding:0;font-size:1em}

.actions{display:flex;gap:4px;margin-top:10px;opacity:0;transition:opacity 0.25s;padding:0 2px}
.msg:hover .actions{opacity:1}
.msg.user .actions{justify-content:flex-end}
.act{background:transparent;border:none;padding:6px 10px;border-radius:7px;color:var(--text-3);font-family:inherit;font-size:0.72rem;font-weight:500;cursor:pointer;transition:all 0.2s cubic-bezier(0.16,1,0.3,1);display:flex;align-items:center;gap:5px;letter-spacing:-0.005em}
.act:hover{background:rgba(255,255,255,0.05);color:var(--text);transform:translateY(-1px)}
.act:active{transform:translateY(0) scale(0.95)}
.act-ic{font-size:12px;opacity:0.8;transition:transform 0.2s}
.act:hover .act-ic{transform:scale(1.2)}
.typing{display:flex;align-items:center;gap:6px;padding:8px 2px}
.typing span{width:6px;height:6px;border-radius:50%;animation:tdot 1.4s ease-in-out infinite}
.typing span:nth-child(1){background:var(--purple);box-shadow:0 0 8px rgba(167,139,250,0.6)}
.typing span:nth-child(2){background:var(--purple-2);box-shadow:0 0 8px rgba(139,92,246,0.6);animation-delay:0.15s}
.typing span:nth-child(3){background:var(--pink);box-shadow:0 0 8px rgba(240,171,252,0.6);animation-delay:0.3s}
@keyframes tdot{0%,60%,100%{opacity:0.3;transform:translateY(0) scale(0.9)}30%{opacity:1;transform:translateY(-5px) scale(1.15)}}

.composer{padding:16px 24px 22px;border-top:1px solid var(--border);background:rgba(11,10,15,0.5);backdrop-filter:blur(20px);z-index:10}
.cbox{display:flex;align-items:flex-end;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:8px 8px 8px 16px;transition:all 0.3s cubic-bezier(0.16,1,0.3,1);position:relative}
.cbox::before{content:'';position:absolute;inset:-1px;border-radius:17px;background:var(--grad);opacity:0;z-index:-1;transition:opacity 0.3s;filter:blur(12px)}
.cbox:focus-within::before{opacity:0.4}
.cbox:focus-within{border-color:rgba(167,139,250,0.4);background:var(--surface);box-shadow:0 0 0 4px rgba(167,139,250,0.08),0 8px 28px -8px rgba(167,139,250,0.2)}
textarea{flex:1;background:transparent;border:none;outline:none;resize:none;color:var(--text);font-family:inherit;font-size:0.94rem;line-height:1.55;padding:11px 0;max-height:150px;font-weight:400;letter-spacing:-0.005em;caret-color:var(--purple)}
textarea::placeholder{color:var(--text-4);animation:placeholderFade 3s ease-in-out infinite}
@keyframes placeholderFade{0%,100%{opacity:0.6}50%{opacity:1}}

.send{width:42px;height:42px;border-radius:13px;background:var(--grad);background-size:200% 200%;border:none;color:white;cursor:pointer;display:grid;place-items:center;transition:all 0.3s cubic-bezier(0.16,1,0.3,1);flex-shrink:0;box-shadow:0 4px 14px -2px rgba(167,139,250,0.4),0 0 0 1px rgba(255,255,255,0.1) inset;position:relative;overflow:hidden;animation:logoGrad 6s ease-in-out infinite}
.send svg{position:relative;z-index:2;transition:transform 0.35s cubic-bezier(0.16,1,0.3,1);filter:drop-shadow(0 1px 2px rgba(0,0,0,0.2))}
.send::after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle,rgba(255,255,255,0.5),transparent 70%);opacity:0;transition:opacity 0.3s}
.send:hover:not(:disabled){transform:translateY(-2px) scale(1.06);box-shadow:0 10px 25px -5px rgba(167,139,250,0.6),0 0 0 1px rgba(255,255,255,0.15) inset}
.send:hover:not(:disabled)::after{opacity:0.35}
.send:hover:not(:disabled) svg{transform:translate(1px,-1px) scale(1.08)}
.send:active:not(:disabled){transform:translateY(0) scale(0.94)}
.send:active:not(:disabled) svg{transform:translate(0,0) scale(0.92)}
.send:disabled{opacity:0.35;cursor:not-allowed}
.send:disabled svg{animation:sendPulse 1.5s ease-in-out infinite}
@keyframes sendPulse{0%,100%{opacity:0.6}50%{opacity:1}}

.hint{text-align:center;font-size:0.68rem;color:var(--text-4);margin-top:10px;letter-spacing:0.02em;font-weight:500}
.hint kbd{padding:1px 5px;border-radius:4px;background:rgba(255,255,255,0.05);border:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:0.62rem;color:var(--text-3);font-weight:500;transition:all 0.2s}
.hint kbd:hover{background:rgba(167,139,250,0.1);border-color:rgba(167,139,250,0.3);color:var(--purple)}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:99;backdrop-filter:blur(4px);animation:overlayIn 0.3s ease}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}
.overlay.show{display:block}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;animation:modalFade 0.25s ease}
.modal-backdrop.show{display:flex}
@keyframes modalFade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--border-2);border-radius:18px;padding:28px;max-width:400px;width:100%;box-shadow:0 30px 80px -20px rgba(0,0,0,0.9),0 0 0 1px rgba(255,255,255,0.04) inset;animation:modalIn 0.4s cubic-bezier(0.16,1,0.3,1);position:relative;overflow:hidden}
@keyframes modalIn{from{opacity:0;transform:scale(0.94) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--grad);opacity:0.5}
.modal-icon{width:48px;height:48px;border-radius:14px;background:var(--grad);background-size:200% 200%;display:grid;place-items:center;color:white;font-size:22px;font-weight:800;margin-bottom:16px;animation:logoGrad 5s ease-in-out infinite;box-shadow:0 8px 20px -4px rgba(167,139,250,0.5)}
.modal-icon::before{content:'+';font-size:24px}
.modal-title{font-size:1.05rem;font-weight:700;color:var(--text);letter-spacing:-0.015em;margin-bottom:8px}
.modal-desc{font-size:0.88rem;color:var(--text-2);line-height:1.6;margin-bottom:24px}
.modal-actions{display:flex;gap:10px}
.modal-btn{flex:1;padding:11px 16px;border-radius:11px;border:none;font-family:inherit;font-size:0.88rem;font-weight:600;letter-spacing:-0.005em;cursor:pointer;transition:all 0.2s cubic-bezier(0.16,1,0.3,1);position:relative;overflow:hidden}
.modal-btn.cancel{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.modal-btn.cancel:hover{background:rgba(255,255,255,0.04);color:var(--text)}
.modal-btn.confirm{background:var(--grad);background-size:200% 200%;color:white;box-shadow:0 4px 14px -2px rgba(167,139,250,0.4);animation:logoGrad 6s ease-in-out infinite}
.modal-btn.confirm:hover{transform:translateY(-1px);box-shadow:0 8px 20px -4px rgba(167,139,250,0.6)}
.modal-btn:active{transform:translateY(0) scale(0.98)}

.ripple{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,0.5),transparent 70%);transform:scale(0);animation:rippleOut 0.8s cubic-bezier(0.16,1,0.3,1);pointer-events:none}
@keyframes rippleOut{to{transform:scale(4);opacity:0}}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);padding:12px 20px;background:rgba(23,22,29,0.95);border:1px solid rgba(167,139,250,0.3);border-radius:12px;color:var(--text);font-size:0.85rem;font-weight:500;box-shadow:0 20px 40px -10px rgba(0,0,0,0.7);backdrop-filter:blur(20px);z-index:1001;opacity:0;transition:all 0.4s cubic-bezier(0.16,1,0.3,1);display:flex;align-items:center;gap:10px}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast-ic{width:20px;height:20px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:11px;color:white}

@media(max-width:768px){
  .topbar{padding:12px 18px}
  .stream{padding:24px 18px;gap:20px}
  .composer{padding:14px 18px 18px}
  .welcome h1{font-size:1.6rem}
  .welcome p{font-size:0.88rem}
  .qc{padding:11px 13px;font-size:0.78rem}
  .msg{gap:11px}
  .av{width:28px;height:28px}
  .bubble{font-size:0.9rem}
  .bubble.user{padding:12px 15px;border-radius:16px}
  .new-chat-shortcut{display:none}
  .modal{padding:24px 22px}
}
</style>
</head>
<body>

<div class="orb-bg">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>
<div class="sparkle-container" id="sparkleContainer"></div>

<div class="app">
  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo"></div>
      <div>
        <div class="brand-name">Aurora</div>
        <div class="brand-sub">AI Assistant</div>
      </div>
    </div>

    <button class="new-chat" id="newChatBtn">
      <span class="new-chat-ic"></span>
      <span class="new-chat-label">
        <span class="main">New Chat</span>
        <span class="sub">Start fresh</span>
      </span>
      <span class="new-chat-shortcut">⌘K</span>
    </button>

    <div class="history-block">
      <div class="history-label">
        <span>Recent</span>
        <span class="count" id="historyCount">0</span>
      </div>
      <div id="historyList"></div>
    </div>

    <div class="nav-block">
      <div class="nav-label">Persona</div>
      <button class="persona active" data-p="You are a helpful, articulate, and highly intelligent AI assistant. Provide clear, thoughtful, and well-structured answers.">
        <span class="persona-icon">✦</span> General Assistant
      </button>
      <button class="persona" data-p="You are a senior software engineer with 15 years of experience. Write clean, production-grade code with best practices.">
        <span class="persona-icon">⌘</span> Senior Engineer
      </button>
      <button class="persona" data-p="You are an award-winning creative writer. Craft vivid, evocative, emotionally resonant prose.">
        <span class="persona-icon">✎</span> Creative Writer
      </button>
      <button class="persona" data-p="You are a strategic business analyst. Provide data-driven insights with clear reasoning.">
        <span class="persona-icon">◎</span> Business Analyst
      </button>
    </div>

    <div class="nav-block" style="border-top:none;padding-top:0">
      <div class="nav-label">Engine</div>
      <div class="engine-wrap">
        <button class="engine-btn" id="engineBtn" type="button">
          <span class="engine-btn-label">
            <span class="engine-btn-dot"></span>
            <span class="engine-btn-text" id="engineBtnText">GPT-OSS · 120B</span>
          </span>
        </button>
        <div class="engine-menu" id="engineMenu">
          <button class="engine-option active" data-value="openai/gpt-oss-120b" data-name="GPT-OSS · 120B" data-desc="Flagship · Most capable">
            <span class="engine-option-mark"></span>
            <span class="engine-option-info">
              <span class="engine-option-name">GPT-OSS 120B</span>
              <span class="engine-option-desc">Flagship · Most capable</span>
            </span>
          </button>
          <button class="engine-option" data-value="openai/gpt-oss-20b" data-name="GPT-OSS · 20B" data-desc="Fast · Balanced">
            <span class="engine-option-mark"></span>
            <span class="engine-option-info">
              <span class="engine-option-name">GPT-OSS 20B</span>
              <span class="engine-option-desc">Fast · Balanced</span>
            </span>
          </button>
          <button class="engine-option" data-value="qwen/qwen3.8-27b" data-name="Qwen · 3.8 27B" data-desc="Reasoning · Efficient">
            <span class="engine-option-mark"></span>
            <span class="engine-option-info">
              <span class="engine-option-name">Qwen 3.8 27B</span>
              <span class="engine-option-desc">Reasoning · Efficient</span>
            </span>
          </button>
          <button class="engine-option" data-value="allam-2-7b" data-name="Allam · 2 7B" data-desc="Lightweight · Ultra-fast">
            <span class="engine-option-mark"></span>
            <span class="engine-option-info">
              <span class="engine-option-name">Allam 2 7B</span>
              <span class="engine-option-desc">Lightweight · Ultra-fast</span>
            </span>
          </button>
        </div>
      </div>
    </div>

    <div class="bottom">
      <button class="ghost" id="exportBtn">
        <span class="ghost-ic">↓</span> Export Chat
      </button>
      <button class="ghost" id="clearBtn">
        <span class="ghost-ic">✕</span> Clear All Chats
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu" id="menuToggle">☰</button>
      <div class="title">
        <span class="status-dot"></span>
        <span id="personaName">General Assistant</span>
      </div>
      <span class="badge">Pro</span>
    </header>

    <div class="stream" id="stream"></div>

    <div class="composer">
      <div class="cbox">
        <textarea id="input" rows="1" placeholder="Ask Aurora anything…"></textarea>
        <button class="send" id="sendBtn" title="Send">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5"/>
            <path d="M5 12l7-7 7 7"/>
          </svg>
        </button>
      </div>
      <div class="hint"><kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> new line</div>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-icon"></div>
    <div class="modal-title" id="modalTitle">Start a new chat?</div>
    <div class="modal-desc" id="modalDesc">Your current conversation will be saved in the sidebar.</div>
    <div class="modal-actions">
      <button class="modal-btn cancel" id="modalCancel">Cancel</button>
      <button class="modal-btn confirm" id="modalConfirm">Start New</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <span class="toast-ic">✓</span>
  <span id="toastText">New chat started</span>
</div>

<script>
(function(){
  const container = document.getElementById('sparkleContainer');
  const colors = ['167,139,250', '240,171,252', '96,165,250', '139,92,246'];
  for(let i = 0; i < 20; i++){
    const s = document.createElement('div');
    s.className = 'sparkle';
    const color = colors[Math.floor(Math.random() * colors.length)];
    s.style.left = Math.random() * 100 + '%';
    s.style.background = `rgba(${color},0.9)`;

const CHATS_KEY = 'aurora_chats_v6';

let currentChatId = localStorage.getItem(CURRENT_KEY);
let isBusy = false;
let persona = "You are a helpful, articulate, and highly intelligent AI assistant. Provide clear, thoughtful, and well-structured answers.";

function getRealChats(){ return allChats.filter(c => c.messages && c.messages.length > 0); }
function getCurrentChat(){ return allChats.find(c => c.id === currentChatId); }
function saveChats(){
  localStorage.setItem(CHATS_KEY, JSON.stringify(allChats));
  localStorage.setItem(CURRENT_KEY, currentChatId || '');
}
function createNewChat(){
  allChats = allChats.filter(c => c.messages && c.messages.length > 0);
  const id = 'chat_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
  const chat = {id:id,title:'New Chat',messages:[],createdAt:Date.now(),updatedAt:Date.now()};
  allChats.unshift(chat);
  currentChatId = id;
  saveChats();
  return chat;
}
function updateChatTitle(chat, firstUserMsg){
  if(!chat || chat.messages.length > 1) return;
  if(chat.title !== 'New Chat') return;
  chat.title = firstUserMsg.slice(0, 40) + (firstUserMsg.length > 40 ? '…' : '');
}
function formatTime(ts){
  const d = new Date(ts); const now = new Date(); const diff = now - d; const oneDay = 86400000;
  if(diff < 60000) return 'Just now';
  if(diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
  if(diff < oneDay) return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
  if(diff < oneDay * 2) return 'Yesterday';
  if(diff < oneDay * 7) return Math.floor(diff / oneDay) + 'd ago';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function renderHistory(){
  const realChats = getRealChats();
  historyCount.textContent = realChats.length;
  if(realChats.length === 0){
    historyList.innerHTML = '<div class="history-empty">No conversations yet</div>';
    return;
  }
  historyList.innerHTML = '';
  realChats.forEach(chat => {
    const item = document.createElement('button');
    item.className = 'history-item' + (chat.id === currentChatId ? ' active' : '');
    item.innerHTML = `
      <span class="history-icon">💬</span>
      <span class="history-info">
        <span class="history-title">${esc(chat.title)}</span>
        <span class="history-time">${formatTime(chat.updatedAt)}</span>
      </span>
      <button class="history-del" data-id="${chat.id}" title="Delete">🗑</button>`;
    item.onclick = (e) => {
      if(e.target.closest('.history-del')) return;
      loadChat(chat.id);
    };
    historyList.appendChild(item);
  });
  historyList.querySelectorAll('.history-del').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      deleteChat(btn.getAttribute('data-id'));
    };
  });
}
function loadChat(id){
  const chat = allChats.find(c => c.id === id);
  if(!chat) return;
  currentChatId = id; saveChats(); renderStream(); renderHistory(); closeSidebar(); showToast('Chat loaded');
}
function deleteChat(id){
  if(!confirm('Delete this conversation permanently?')) return;
  allChats = allChats.filter(c => c.id !== id);
  if(currentChatId === id){
    const remaining = getRealChats();
    currentChatId = remaining[0]?.id || null;
    if(!currentChatId){ createNewChat(); }
  }
  saveChats(); renderStream(); renderHistory(); showToast('Chat deleted');
}
let modalCallback = null;
function showModal(title, desc, confirmText, callback){

  modalCallback = callback; modalBackdrop.classList.add('show');
}
function hideModal(){ modalBackdrop.classList.remove('show'); modalCallback = null; }
modalCancel.onclick = hideModal;
modalBackdrop.onclick = (e) => { if(e.target === modalBackdrop) hideModal(); };
modalConfirm.onclick = () => { const cb = modalCallback; hideModal(); if(cb) cb(); };
function showToast(msg){
  toastText.textContent = msg; toast.classList.add('show');

}
function openSidebar(){sidebar.classList.add('open');overlay.classList.add('show')}

menuToggle.onclick = () => sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
overlay.onclick = closeSidebar;
function ripples(e, el){
  const rect = el.getBoundingClientRect();
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  const size = Math.max(rect.width, rect.height);
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
  ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
  el.appendChild(ripple);
  setTimeout(() => ripple.remove(), 800);
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function md(t){
  let h = esc(t);
  h = h.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>`<pre><code>${c.trim()}</code></pre>`);
  h = h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h = h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  h = h.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g,'<em>$1</em>');
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/\n/g,'<br>');
  return h;
}
function timeNow(){
  const d = new Date();

}
function renderWelcome(){

function renderStream(){
  const chat = getCurrentChat();
  if(!chat || chat.messages.length === 0){ renderWelcome(); return; }
  stream.innerHTML = '';
  chat.messages.forEach((m, i) => {

function buildMessageEl(who, text, timeLabel){
  const row = document.createElement('div');
  row.className = 'msg ' + who;
  const avatar = who === 'user' ? 'YOU' : '';
  const name = who === 'user' ? 'You' : 'Aurora';
  const actions = who === 'bot' ? `
    <div class="actions">
      <button class="act" onclick="speakText(this)" data-text="${esc(String(text).replace(/<[^>]*>/g,''))}"><span class="act-ic">🔊</span> Read</button>

  row.innerHTML = `

window.speakText = (btn) => {
  const text = btn.getAttribute('data-text');
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = /[\u0980-\u09FF]/.test(text) ? 'bn-BD' : 'en-US';
    window.speechSynthesis.speak(u);
  }
};
window.copyText = (btn) => {
  navigator.clipboard.writeText(btn.getAttribute('data-text')).then(() => {

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';

});
async function send(e){
  const t = inputEl.value.trim();
  if(!t || isBusy) return;
  let chat = getCurrentChat();
  if(!chat){ chat = createNewChat(); }
  if(e) ripples(e, sendBtn);
  isBusy = true; sendBtn.disabled = true;
  inputEl.value = ''; inputEl.style.height = 'auto';
  const isFirstMsg = chat.messages.length === 0;
  chat.messages.push({ role: 'user', content: t, time: Date.now() });
  if(isFirstMsg) updateChatTitle(chat, t);
  chat.updatedAt = Date.now();
  saveChats();
  appendMessage('user', t);
  renderHistory();
  typing();
  try {
    const res = await fetch(GROQ_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + GROQ_KEY },
      body: JSON.stringify({
        model: selectedModel,
        messages: [
          /* 🔑 Base identity prompt (Nazmul vai) */
          {role: 'system', content: BASE_SYSTEM_PROMPT},
          /* Persona style */
          {role: 'system', content: persona},
          ...chat.messages.slice(-9).map(m => ({role: m.role, content: m.content}))
        ],
        temperature: 0.7,
        max_tokens: 2048
      })
    });
    if(!res.ok){
      const e2 = await res.json().catch(()=>({}));
      throw new Error(e2.error?.message || ('HTTP ' + res.status));
    }
    const d = await res.json();
    document.getElementById('t')?.remove();
    const reply = d.choices?.[0]?.message?.content || 'No response';
    chat.messages.push({ role: 'assistant', content: reply, time: Date.now() });
    chat.updatedAt = Date.now();
    saveChats();
    appendMessage('bot', reply);
    renderHistory();
  } catch(err){
    document.getElementById('t')?.remove();
    const errMsg = '⚠️ Error: ' + err.message;
    appendMessage('bot', errMsg);
    chat.messages.push({ role: 'assistant', content: errMsg, time: Date.now() });
    chat.updatedAt = Date.now();
    saveChats();
    renderHistory();
  } finally {
    isBusy = false; sendBtn.disabled = false; inputEl.focus(); closeSidebar();
  }
}
sendBtn.onclick = (e) => send(e);
inputEl.addEventListener('keydown', e => {

clearBtn.onclick = (e) => {

exportBtn.onclick = (e) => {

  closeSidebar();
  showToast('Chat exported');
};

})();
